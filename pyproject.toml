[project]
name = "agr-opentui"
version = "0.3.2"
description = "OpenTUI frontend for agr"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Rasmus" },
]
keywords = ["agr", "tui", "cli", "skills", "opentui"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
  "agr>=0.7.4",
]

[project.scripts]
agr-opentui = "agr_opentui.cli:main"

[project.urls]
Homepage = "https://github.com/RelativeSure/agr-opentui"
Repository = "https://github.com/RelativeSure/agr-opentui"
Issues = "https://github.com/RelativeSure/agr-opentui/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
  "agr_opentui/bin/agr-opentui",
]
