name: publish-pypi

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump_version:
        description: "Run bump-version before building and publishing"
        required: true
        type: boolean
        default: false
      version:
        description: "New version to use when bump_version is enabled (example: 0.3.0)"
        required: false
        type: string
      branch:
        description: "Branch to build from (and bump when enabled)"
        required: true
        type: string
        default: master
      target:
        description: "Where to publish the package"
        required: true
        type: choice
        options:
          - pypi
          - testpypi
        default: pypi

permissions:
  contents: write

jobs:
  bump-version:
    if: github.event_name == 'workflow_dispatch' && inputs.bump_version
    uses: ./.github/workflows/bump-version.yml
    with:
      version: ${{ inputs.version }}
      branch: ${{ inputs.branch }}
      create_tag: true
      create_release: false
    secrets: inherit

  build:
    needs: bump-version
    if: ${{ always() && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (workflow_dispatch branch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Checkout (release ref)
        if: github.event_name == 'release'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install Bun dependencies
        run: bun install

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          make py-build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: python-dist
          path: dist/

  publish-pypi:
    if: |
      always() &&
      needs.build.result == 'success' &&
      (
        github.event_name == 'release' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.target != 'testpypi'
        )
      )
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    if: |
      always() &&
      needs.build.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: testpypi
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
