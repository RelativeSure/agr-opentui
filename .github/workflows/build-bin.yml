name: build-bin

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      BASE_NAME: agr-opentui
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.10'

      - name: Cache Bun dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install

      - name: Build binary
        run: make build

      - name: Compute artifact name
        id: name
        shell: bash
        run: |
          sanitize() {
            local value="$1"
            value="${value//\//-}"
            value="${value//_/-}"
            echo "$value"
          }

          ref="${GITHUB_REF#refs/heads/}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            safe_tag="$(sanitize "$tag")"
            name="${BASE_NAME}-tag-${safe_tag}"
          elif [[ "${ref}" == "master" ]]; then
            name="${BASE_NAME}"
          else
            safe_ref="$(sanitize "$ref")"
            name="${BASE_NAME}-branch-${safe_ref}"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Rename binary
        run: mv bin/agr-opentui "bin/${{ steps.name.outputs.name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ steps.name.outputs.name }}-linux
          path: bin/${{ steps.name.outputs.name }}

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: bin/${{ steps.name.outputs.name }}
