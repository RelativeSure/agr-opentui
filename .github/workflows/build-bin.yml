name: build-bin

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      BASE_NAME: agr-opentui
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: '1.3.8'

      - name: Cache Bun dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install

      - name: Build binary
        run: make build

      - name: Compute artifact name
        id: name
        shell: bash
        run: |
          sanitize() {
            local value="$1"
            value="${value//\//-}"
            value="${value//_/-}"
            echo "$value"
          }

          ref="${GITHUB_REF#refs/heads/}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            safe_tag="$(sanitize "$tag")"
            name="${BASE_NAME}-tag-${safe_tag}"
          elif [[ "${ref}" == "master" ]]; then
            name="${BASE_NAME}"
          else
            safe_ref="$(sanitize "$ref")"
            name="${BASE_NAME}-branch-${safe_ref}"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Rename binary
        run: mv bin/agr-tui "bin/${{ steps.name.outputs.name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.name.outputs.name }}-linux
          path: bin/${{ steps.name.outputs.name }}

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          files: bin/${{ steps.name.outputs.name }}
