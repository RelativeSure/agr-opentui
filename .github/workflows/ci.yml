name: ci

on:
  push:
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Lint GitHub workflows
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  ui-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Cache Bun dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Run UI snapshot tests
        run: bun test test/ui_controller.test.ts

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Cache Bun dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Run checks
        run: bun run check

      - name: Build binary
        run: bun run build

      - name: Run strict unused checks
        run: bunx tsc --noEmit --noUnusedLocals --noUnusedParameters

      - name: Build Python package
        run: |
          python -m pip install --upgrade pip build
          make py-build

      - name: Smoke test built binary in separate repo
        run: |
          TMP_REPO="$(mktemp -d)"
          printf 'dependencies = []\n' > "$TMP_REPO/agr.toml"

          set +e
          timeout 8s script -qec "cd \"$TMP_REPO\" && \"$GITHUB_WORKSPACE/bin/agr-opentui\"" /dev/null
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "built agr-opentui binary crashed during startup smoke test (exit=$rc)"
            exit "$rc"
          fi

      - name: Smoke test uv tool install from wheel in separate repo
        run: |
          uv tool install dist/*.whl
          TOOL_PY="$HOME/.local/share/uv/tools/agr-opentui/bin/python"
          test -x "$TOOL_PY"

          TMP_REPO="$(mktemp -d)"
          printf 'dependencies = []\n' > "$TMP_REPO/agr.toml"
          cd "$TMP_REPO"

          AGR_OPENTUI_LAUNCHER_PYTHON="$TOOL_PY" "$TOOL_PY" -m agr_opentui.bridge > bridge.json
          python - <<'PY'
          import json
          with open("bridge.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          assert isinstance(data, dict)
          assert "dependencies" in data
          assert "tools" in data
          PY

          set +e
          timeout 8s script -qec "cd \"$TMP_REPO\" && AGR_OPENTUI_LAUNCHER_PYTHON=\"$TOOL_PY\" \"$TOOL_PY\" -m agr_opentui.cli" /dev/null
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "agr-opentui crashed during startup smoke test (exit=$rc)"
            exit "$rc"
          fi
