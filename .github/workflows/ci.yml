name: ci

on:
  push:
  pull_request:

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Lint GitHub workflows
        uses: rhysd/actionlint@0933c147c9d6587653d45fdcb4c497c57a65f9af # v1.7.10

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: "1.3.9"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Cache Bun dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Run checks
        run: bun run check

      - name: Build binary
        run: bun run build

      - name: Run strict unused checks
        run: bunx tsc --noEmit --noUnusedLocals --noUnusedParameters

      - name: Build Python package
        run: |
          python -m pip install --upgrade pip build
          make py-build

      - name: Smoke test uv tool install from wheel in separate repo
        run: |
          uv tool install dist/*.whl
          TOOL_PY="$HOME/.local/share/uv/tools/agr-opentui/bin/python"
          test -x "$TOOL_PY"

          TMP_REPO="$(mktemp -d)"
          printf 'dependencies = []\n' > "$TMP_REPO/agr.toml"
          cd "$TMP_REPO"

          AGR_OPENTUI_LAUNCHER_PYTHON="$TOOL_PY" "$TOOL_PY" -m agr_opentui.bridge > bridge.json
          python - <<'PY'
          import json
          with open("bridge.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          assert isinstance(data, dict)
          assert "dependencies" in data
          assert "tools" in data
          PY

          set +e
          timeout 8s script -qec "cd \"$TMP_REPO\" && AGR_OPENTUI_LAUNCHER_PYTHON=\"$TOOL_PY\" \"$TOOL_PY\" -m agr_opentui.cli" /dev/null
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "agr-opentui crashed during startup smoke test (exit=$rc)"
            exit "$rc"
          fi
